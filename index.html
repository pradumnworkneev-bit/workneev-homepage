n:"How we expect to be judged"}),i.jsx("h2",{className:"h2",children:"The measure of transformation is the institution itself."})]}),i.jsx("p",{className:"lede",children:"Workneev is not measured by reports delivered or programmes completed. These are the eight things that should be true of an institution afterwards, and the standard we accept being held to."})]}),i.jsx("div",{className:"outs",children:fv.map(([c,r,h],o)=>i.jsxs("div",{className:"out-card lift","data-reveal":!0,style:{"--d":`${o%4*.05}s`},children:[i.jsx("span",{className:"num",children:c}),i.jsx("h3",{children:r}),i.jsx("p",{children:h}),i.jsxs("div",{className:"pend",children:[i.jsx("i",{}),"Not yet evidenced"]})]},c))}),i.jsxs("div",{className:"honest","data-reveal":!0,children:[i.jsx("span",{className:"tag",children:"No results yet"}),i.jsx("p",{children:"We have not published a result against any of these, because no institution has completed an engagement yet. When one has, and agrees to have the findings examined, it will appear here."})]})]})})}const dv=[{q:"Are you an NEP consultancy?",a:["NEP is where a great many of these conversations begin, and we work within it. It is not the boundary of the work.","An institution can restructure its programmes, adopt the credit framework and satisfy every structural requirement while teaching, progression and outcomes stay exactly as they were. That institution has changed its paperwork. Our interest is in the other thing."]},{q:"Are you accreditation consultants?",a:["We work on institutional quality, and accreditation is usually a consequence of it. But an accreditation consultant improves how an institution is presented within a cycle, and that is a different service.","If your institution is genuinely strong and only the documentation is weak, hire a good one; it is cheaper and it will work. If the assessment keeps reflecting something you do not recognise, the documentation was never the problem."]},{q:"Are you a technology company?",a:["No. We hold no reseller agreement or commission arrangement with any vendor, which is what allows us to tell an institution its existing systems are adequate.","We assess what the institution needs, help evaluate it, and support implementation. The system is instrumentation for the transformation, not the transformation."]},{q:"Can you get us autonomy, or a better grade?",a:["No, and we would be careful of anyone who says otherwise. Those decisions belong to regulators and rest on evidence.","We assess readiness honestly, build the capability the criteria are testing for, and help construct the evidence. Occasionally the honest assessment is that the institution should not apply this cycle. That answer has saved institutions more than a rushed application would have earned them."]},{q:"We have an IQAC and a capable team. Why bring in a firm?",a:["Your team knows the institution better than we ever will, and for a great many priorities they are the right answer.","What they do not have is a comparative view — no way to know whether a given result is good or poor for an institution of your type — or the professional freedom to be candid about decisions their own leadership made. We bring both, plus a method and a coordination capacity most institutions cannot staff internally. The intent is to strengthen your team’s ability to run this, not to replace it."]},{q:"How long before anything changes?",a:["The diagnostic takes two weeks and you will have a clear answer at the end of it. Institutional change is slower, and we would rather say so now — the minimum meaningful programme is twelve months and twenty-four is more common.","Governance, academic architecture and faculty capability do not move in a quarter. A firm promising transformation in ninety days is describing a documentation exercise."]}];function mv(){const[c,r]=R.useState(0),[h,o]=R.useState(!1),y=R.useRef([]),T=(E,M)=>{h||r(M?E:-1)};return i.jsx("section",{className:"band",id:"faq",children:i.jsxs("div",{className
